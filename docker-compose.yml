# The image runs as a fixed non-root user (uid 10001). On Linux, `mkdir -p
# reports && chmod 777 reports` before the first run so the container can
# write into the bind-mounted ./reports directory.
services:
  requesttrace:
    build: .
    image: requesttrace:local
    volumes:
      - ./reports:/app/reports
    # Example: docker compose run --rm requesttrace scan https://example.com --report
    entrypoint: ["tini", "--", "requesttrace"]
    command: ["--help"]
