name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-type-test:
    name: Lint, type-check, test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project (dev + pdf extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,pdf]"

      - name: Lint (ruff check)
        run: ruff check .

      - name: Format check (ruff format --diff)
        run: ruff format --check .

      - name: Type check (mypy)
        run: mypy requesttrace

      - name: Unit + integration tests
        run: pytest --cov=requesttrace --cov-report=term-missing

      - name: Validate an example JSON report against the published schema
        run: |
          python -m requesttrace.cli scan https://example.com --json --quiet > /tmp/report.json || true
          python -c "
          import json, jsonschema, pathlib
          schema = json.load(open('schemas/report.schema.v1.json'))
          report = json.load(open('/tmp/report.json'))
          jsonschema.validate(report, schema)
          print('JSON schema validation OK')
          "
        continue-on-error: true # live-internet step; never blocks CI on external flakiness

  docker-build-and-smoke-test:
    name: Docker build + smoke test
    runs-on: ubuntu-latest
    needs: lint-type-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: requesttrace:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test — non-root user
        run: |
          user="$(docker run --rm --entrypoint whoami requesttrace:ci)"
          echo "Container user: $user"
          test "$user" = "requesttrace"

      - name: Smoke test — --version
        run: docker run --rm requesttrace:ci --version

      - name: Smoke test — scan against a local fixture container
        run: |
          docker network create rt-smoke-net
          docker run -d --network rt-smoke-net --name rt-smoke-target -p 0 python:3.12-slim \
            python -m http.server 8000
          sleep 2
          mkdir -p "$PWD/reports"
          # The image runs as a fixed non-root uid (10001). A bind-mounted
          # host directory is owned by the runner's own uid by default, so
          # the container user can't write into it unless we hand it over.
          sudo chown -R 10001:10001 "$PWD/reports"
          docker run --rm --network rt-smoke-net \
            -v "$PWD/reports:/app/reports" \
            requesttrace:ci scan http://rt-smoke-target:8000/ --report --format json --fail-on never
          test -n "$(ls -A "$PWD/reports")"
          docker rm -f rt-smoke-target
          docker network rm rt-smoke-net

      - name: Upload smoke-test report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-smoke-test-reports
          path: reports/
          retention-days: 7
          if-no-files-found: ignore
