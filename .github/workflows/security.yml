name: Security

on:
  push:
    # SAST/SCA/secrets/license/IaC jobs run on every push here, including
    # dev and chore/* branches, for fast feedback during development. The
    # `dast` job below additionally restricts itself to main only — see its
    # `if:` condition.
    branches: [main, dev, "chore/**"]
  pull_request:
  schedule:
    # Weekly, independent of code changes — dependency/base-image CVEs get
    # disclosed on their own schedule, not ours.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history, so gitleaks checks past commits too

      - name: Install gitleaks
        run: |
          curl -sSL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks

      - name: Run gitleaks
        run: |
          gitleaks detect --source . --report-format sarif --report-path gitleaks-results.sarif --redact --exit-code 1

      - name: Upload gitleaks SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: gitleaks-results.sarif
          category: gitleaks

  sast:
    name: SAST (Bandit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: pip install "bandit[sarif]>=1.7,<2"

      - name: Run Bandit
        run: bandit -r requesttrace -f sarif -o bandit-results.sarif -ll
        # Bandit exits non-zero on findings; that failure is the gate itself,
        # not swallowed — but we still want the SARIF uploaded either way.
        continue-on-error: true
        id: bandit

      - name: Upload Bandit SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: bandit-results.sarif
          category: bandit

      - name: Fail if Bandit found issues
        if: steps.bandit.outcome == 'failure'
        run: exit 1

  codeql:
    name: SAST (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    # CodeQL analysis for private repositories requires GitHub Advanced
    # Security to be enabled on the repo/org; on public repos it's free.
    # continue-on-error keeps this job from red-X'ing the whole workflow if
    # GHAS isn't enabled — Bandit above already covers baseline Python SAST.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: codeql-python

  sca:
    name: SCA — dependency vulnerabilities (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install project + pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[pdf]"
          pip install "pip-audit>=2.7,<3"

      - name: Audit dependencies (fails on known vulnerabilities)
        run: pip-audit --desc --skip-editable

  license-check:
    name: SCA — dependency license compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install project + pip-licenses
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[pdf]"
          pip install pip-licenses

      - name: Reject copyleft licenses incompatible with MIT distribution
        run: |
          pip-licenses --format=markdown --output-file=licenses.md
          cat licenses.md
          pip-licenses --fail-on="GPL v2;GPL v3;GPL v2+;GPL v3+;AGPL v3;AGPL v3+"

      - name: Upload license report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-licenses
          path: licenses.md
          retention-days: 30

  dockerfile-lint:
    name: IaC — Dockerfile lint (hadolint)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Run hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          format: sarif
          output-file: hadolint-results.sarif
          no-fail: true

      - name: Upload hadolint SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: hadolint-results.sarif
          category: hadolint

  container-scan:
    name: SCA — container image scan (Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: requesttrace:security-scan
          # Deliberately no cache-from/cache-to here: this build feeds a
          # security gate, and ci.yml's own Docker job writes to the same
          # default GHA cache scope. Reusing those layers risks scanning
          # something other than exactly what this commit's Dockerfile
          # produces. A few extra seconds of build time is the right
          # trade-off for a scan whose entire job is trustworthiness.
          no-cache: true

      - name: Confirm .trivyignore is present at scan time
        run: |
          pwd
          ls -la .trivyignore
          echo "--- content ---"
          cat .trivyignore

      # Human-readable, non-blocking: this is the step to read when the
      # gate below fails — it prints exactly what Trivy found (and what it
      # suppressed) directly in this log, instead of only writing to the
      # SARIF file that only shows up in the Security tab.
      - name: Trivy image scan (human-readable report)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: requesttrace:security-scan
          format: table
          severity: CRITICAL,HIGH
          exit-code: "0"
          trivyignores: .trivyignore

      - name: Trivy image scan (gate)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: requesttrace:security-scan
          format: sarif
          output: trivy-image-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
          trivyignores: .trivyignore

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-image-results.sarif
          category: trivy-image

  dast:
    name: DAST — dynamic detection self-test
    runs-on: ubuntu-latest
    # Dynamic scanning runs a real build and live target, so it's reserved
    # for main only — not every dev/chore push or PR. `github.ref` is the
    # default branch for schedule/workflow_dispatch runs, so those still fire.
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      # RequestTrace has no web frontend of its own to point a classic DAST
      # scanner at (OWASP ZAP etc.) — it *is* a dynamic scanner. So this job
      # is our DAST equivalent: run it, live, against a deliberately
      # insecure local HTTP target (no security headers, no TLS) and assert
      # it dynamically detects and reports real findings, end to end,
      # exactly as it would against a production target.
      - name: Serve a deliberately insecure local target
        run: |
          python -m http.server 8000 --directory /tmp &
          echo $! > server.pid
          sleep 1

      - name: Dynamic scan and assert findings are detected
        run: |
          set +e
          requesttrace scan http://127.0.0.1:8000/ --fail-on low --json > dast-results.json
          exit_code=$?
          set -e
          kill "$(cat server.pid)" 2>/dev/null || true

          if [ "$exit_code" -ne 1 ]; then
            echo "::error::Expected a policy breach (exit 1) scanning an insecure target with no security headers; got exit $exit_code"
            exit 1
          fi
          echo "Dynamic detection verified: findings correctly reported (exit 1) against an insecure target."

      - name: Upload DAST self-test result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dast-self-test-report
          path: dast-results.json
          retention-days: 7
          if-no-files-found: ignore
