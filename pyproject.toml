[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "requesttrace"
version = "1.0.0"
description = "Open-source production request-path, TLS and HTTP security assessment CLI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "RequestTrace Contributors" }]
keywords = ["security", "tls", "http", "dns", "devsecops", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]

dependencies = [
    "click>=8.1,<9",
    "dnspython>=2.6,<3",
    "requests>=2.31,<3",
    "cryptography>=49,<51",
    "jinja2>=3.1,<4",
]

[project.optional-dependencies]
pdf = ["fpdf2>=2.7,<3"]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-cov>=5,<6",
    "responses>=0.25,<1",
    "ruff>=0.5,<1",
    "mypy>=1.10,<2",
    "types-requests",
    "jsonschema>=4.22,<5",
    "pre-commit>=3.7,<4",
]
security = [
    "bandit[sarif]>=1.7,<2",
    "pip-audit>=2.7,<3",
]

[project.urls]
Homepage = "https://github.com/micheaol/requesttrace"
Issues = "https://github.com/micheaol/requesttrace/issues"

[project.scripts]
requesttrace = "requesttrace.cli:main"

[tool.setuptools.packages.find]
include = ["requesttrace*"]

[tool.setuptools.package-data]
requesttrace = ["reporting/templates/*.j2", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Finding/remediation text is long-form human prose; wrapping it hurts
# readability and grep-ability more than it helps.
"requesttrace/rules/*.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
